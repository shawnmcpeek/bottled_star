name: bottled_star
description: "Bottled Star — a fusion drop-and-merge physics game."
publish_to: 'none'
version: 1.2.8+8

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.38.0
  shared_preferences: ^2.5.5
  flame_forge2d: ^0.19.3+7
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  audioplayers: ^6.8.1
  purchases_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo.png
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/logo.png
  web:
    generate: true
    image_path: assets/branding/logo.png
    background_color: "#000000"
    theme_color: "#0B0710"
  windows:
    generate: true
    image_path: assets/branding/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo.png
    - assets/images/elements/
    - assets/levels/
    - assets/music/loops/
    - assets/sfx/
    - assets/sfx/plucks/harmonic_minor/
    - assets/sfx/plucks/diminished/
    - assets/sfx/plucks/augmented/

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
